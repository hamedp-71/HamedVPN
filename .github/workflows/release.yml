name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # این خط باعث می‌شود دکمه اجرای دستی اضافه شود

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Download libv2ray.aar
        run: |
          mkdir -p app/libs
          curl -L "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.5/libv2ray.aar" -o app/libs/libv2ray.aar

      - name: Build with Gradle
        env:
          # چون فایل را در مرحله قبل آپلود کردیم، اینجا مستقیم از آن استفاده می‌کنیم
          RELEASE_STORE_FILE: "mehmmet.jks"
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
