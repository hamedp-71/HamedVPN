name: Android Build & Release

# اجرا شدن با هر تغییر روی main، با هر تگ، یا به صورت دستی
on:
  push:
    branches:
      - main
      - master
    tags:
      - '1.0.0*'
  workflow_dispatch:

# دسترسی برای ساخت Release رسمی در گیت‌هاب
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inspect Project Directory
        run: |
          PROJECT_DIR="."
          if [ -d "V2rayNG" ]; then
            PROJECT_DIR="V2rayNG"
          elif [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            FOUND_DIR=$(find . -maxdepth 2 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs -r dirname)
            if [ -n "$FOUND_DIR" ]; then
              PROJECT_DIR="$FOUND_DIR"
            fi
          fi
          echo "TARGET_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Verify or Fix Keystore
        run: |
          KEY_PATH="${{ env.TARGET_DIR }}/app/mehmmet.jks"
          KEY_ALIAS="mehmmetvpn"
          
          if [ -f "$KEY_PATH" ] && keytool -list -keystore "$KEY_PATH" -storepass "MEHMMETT.2002" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "SIGN_PASS=MEHMMETT.2002" >> $GITHUB_ENV
          elif [ -f "$KEY_PATH" ] && keytool -list -keystore "$KEY_PATH" -storepass "MEHMMET.2002" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "SIGN_PASS=MEHMMET.2002" >> $GITHUB_ENV
          else
            mkdir -p "${{ env.TARGET_DIR }}/app"
            rm -f "$KEY_PATH"
            keytool -genkeypair -v -keystore "$KEY_PATH" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "MEHMMET.2002" -keypass "MEHMMET.2002" -dname "CN=HamedVPN, OU=App, O=Hamed, L=Tehran, ST=Tehran, C=IR"
            echo "SIGN_PASS=MEHMMET.2002" >> $GITHUB_ENV
          fi

      - name: Download libv2ray.aar
        run: |
          mkdir -p ${{ env.TARGET_DIR }}/app/libs
          curl -L "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.5/libv2ray.aar" -o ${{ env.TARGET_DIR }}/app/libs/libv2ray.aar

      - name: Build with Gradle
        working-directory: ${{ env.TARGET_DIR }}
        env:
          RELEASE_STORE_FILE: "mehmmet.jks"
          RELEASE_STORE_PASSWORD: ${{ env.SIGN_PASS }}
          RELEASE_KEY_ALIAS: "mehmmetvpn"
          RELEASE_KEY_PASSWORD: ${{ env.SIGN_PASS }}
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # دانلود مستقیم APKها در تب Actions (بدون نیاز به تگ)
      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HamedVPN-APKs
          path: ${{ env.TARGET_DIR }}/app/build/outputs/apk/**/*.apk

      # ساخت Release رسمی اگر تگی ثبت شده باشد
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.TARGET_DIR }}/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
